aid: dupe
name: Dupe
description: >-
  Dupe.com is a free AI-powered visual search engine and product-comparison
  platform that finds near-identical, lower-priced alternatives ("dupes") to
  designer and higher-priced products. Users paste any product URL, upload an
  image, or type a description, and Dupe's visual matching surfaces similar items
  from thousands of online retailers at up to 90% less — spanning furniture, home
  decor, fashion, footwear, beauty, and more. The service also offers AI research
  reports, room/outfit restyling, a Chrome extension, an iOS app, and a $DUPE
  rewards program, and it earns revenue through affiliate commissions at no extra
  cost to users. Dupe additionally operates a hosted Model Context Protocol (MCP)
  server so AI assistants can search its catalog programmatically. Backed by
  Kindred Ventures.
